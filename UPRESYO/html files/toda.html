<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ride fares | UPRESYO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- index.css first (colors and fonts), then toda.css on top -->
    <link rel="stylesheet" href="../css%20files/index.css">
    <link rel="stylesheet" href="../css%20files/toda.css">
</head>

<body class="ride-page">

    <!-- Back to the home map -->
    <a href="index.html" class="back-pill">&larr; Home</a>

    <main class="ride">

        <section class="fare-machine" aria-labelledby="fareTitle">

            <!-- Header band -->
            <header class="machine-top">
                <p class="machine-label">UP Mindanao rides</p>
                <h1 class="fare-title" id="fareTitle">Tricycle fares</h1>
            </header>

            <!-- Ride picker: Ikot or Tricycle -->
            <div class="ride-tabs" role="tablist" aria-label="Choose a ride">
                <button type="button" class="tab" role="tab" data-mode="ikot" aria-selected="false">
                    <img src="../images/finalikot.png" alt="">
                    <span>Ikot</span>
                </button>
                <button type="button" class="tab" role="tab" data-mode="tricycle" aria-selected="true">
                    <img src="../images/finaltoda.png" alt="">
                    <span>Tricycle</span>
            </div>

            <form class="calc" id="fareForm" onsubmit="return false">

                <!-- From / To -->
                <div class="route">
                    <label class="field">
                        <span>From</span>
                        <select id="fromSelect"></select>
                    </label>

                    <button type="button" class="swap" id="swapBtn" aria-label="Swap From and To">&#8644;</button>

                    <label class="field">
                        <span>To</span>
                        <select id="toSelect"></select>
                    </label>
                </div>

                <!-- Riders -->
                <fieldset class="riders">
                    <legend>Riders</legend>
                    <div class="rider-options">
                        <button type="button" data-riders="1" aria-pressed="true">1</button>
                        <button type="button" data-riders="2" aria-pressed="false">2</button>
                        <button type="button" data-riders="more" aria-pressed="false">More</button>
                    </div>
                    <input type="number" id="moreCount" class="more-count"
       min="3" max="6" value="3" step="1"
       aria-label="How many riders?" hidden>
                </fieldset>

                <!-- Fare meter -->
                <div class="meter">
                    <span class="meter-label">Total fare</span>
                    <div class="meter-screen">
                        <span class="peso" aria-hidden="true">&#8369;</span>
                        <output id="fareOutput" for="fromSelect toSelect"
                                aria-live="polite" aria-label="Total fare">&mdash;</output>
                    </div>
                    <span class="meter-note" id="fareNote">Pick where you're going</span>
                </div>

                <button type="button" class="btn-browse" id="browseBtn">Browse all fares</button>

                <div class="result" id="result" aria-live="polite">
                    <p class="hint">Fares will show here.</p>
                </div>

            </form>
        </section>

    </main>

    <script src="../js%20files/toda.js" defer></script>
</body>
</html>
